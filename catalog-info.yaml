# ---------- GROUP: el equipo dueño ----------
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: equipo-hola-mundo
  description: Equipo responsable del servicio Hola Mundo
spec:
  type: team
  children: []

---
# ---------- USER: un miembro del equipo ----------
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: alejandro
spec:
  memberOf: [equipo-hola-mundo]

---
# ---------- SYSTEM: agrupa todo lo relacionado ----------
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: sistema-hola-mundo
  description: Sistema que agrupa el servicio, la API y la base de datos de Hola Mundo
spec:
  owner: equipo-hola-mundo

---
# ---------- API: lo que expone el servicio ----------
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: hola-mundo-api
  description: API que devuelve un saludo
spec:
  type: openapi
  lifecycle: experimental
  owner: equipo-hola-mundo
  system: sistema-hola-mundo
  definition: |
    openapi: 3.0.0
    info:
      title: Hola Mundo API
      version: 1.0.0
    paths:
      /hola:
        get:
          responses:
            '200':
              description: Saludo exitoso

---
# ---------- RESOURCE: la infraestructura que usa el servicio ----------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: hola-mundo-db
  description: Base de datos del servicio Hola Mundo
spec:
  type: database
  owner: equipo-hola-mundo
  system: sistema-hola-mundo

---
# ---------- COMPONENT: el servicio en sí ----------
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hola-mundo-service
  description: Servicio que dice "Hola Mundo"
spec:
  type: service
  lifecycle: experimental
  owner: equipo-hola-mundo
  system: sistema-hola-mundo
  providesApis:
    - hola-mundo-api
  dependsOn:
    - resource:hola-mundo-db
